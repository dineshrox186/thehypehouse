<style>
:root{--bg:#030103;--line:#ffb7d0;--ring:#ff9cc0;--spark:#ffe9f1;--ui:#ff9cc0;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;padding-bottom:100vh;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;overflow-x:hidden}
#logo{width:min(96vw,1180px);height:auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,70,140,.5)) drop-shadow(0 0 18px rgba(255,70,140,.3))}
.t{fill-rule:evenodd;fill:url(#g);fill-opacity:0;stroke:var(--line);stroke-width:6;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.ring{fill:none;stroke:var(--ring);stroke-width:3.2;stroke-dasharray:1 2;stroke-dashoffset:1}
.sp{fill:var(--spark);transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-90deg)}
.go .t{animation:draw var(--dur) var(--delay) cubic-bezier(.65,0,.35,1) forwards,fillin 1s calc(var(--delay) + var(--dur) * .7) ease forwards}
.go .ring{animation:draw var(--dur) var(--delay) cubic-bezier(.5,0,.3,1) forwards}
.go .sp{animation:pop .7s var(--delay) cubic-bezier(.2,1.4,.4,1) forwards,twinkle 2.6s calc(var(--delay) + .7s) ease-in-out infinite}
#logo.go{animation:pulse 3.2s 7s ease-in-out infinite alternate}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-width:1.8}}
@keyframes pop{to{transform:scale(1) rotate(0)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.7) rotate(20deg)}}
@keyframes pulse{from{filter:drop-shadow(0 0 6px rgba(255,70,140,.5)) drop-shadow(0 0 18px rgba(255,70,140,.3))}
  to{filter:drop-shadow(0 0 10px rgba(255,70,140,.8)) drop-shadow(0 0 34px rgba(255,70,140,.45))}}
